<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Inventario - PVC</title>
  <style>
    body { 
      font-family: Arial, sans-serif; 
      margin: 0; 
      padding: 10px; 
      background: #f1f5f9; 
      color: #0f172a; 
    }
    .container { max-width: 600px; margin: auto; }
    
    .card { 
      background: #ffffff; 
      padding: 20px; 
      border-radius: 14px; 
      box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
      margin-bottom: 18px; 
      border: 2px solid #cbd5e1;
    }
    
    h2 { 
      margin-top: 0; 
      color: #0f172a; 
      font-size: 24px; 
      text-align: center; 
      border-bottom: 3px solid #e2e8f0; 
      padding-bottom: 10px; 
      font-weight: bold;
    }
    
    label { 
      display: block; 
      margin-top: 14px; 
      font-weight: bold; 
      font-size: 18px; 
      color: #1e293b; 
    }
    
    select, input { 
      width: 100%; 
      padding: 16px; 
      margin-top: 6px; 
      box-sizing: border-box; 
      border: 3px solid #94a3b8; 
      border-radius: 10px; 
      font-size: 20px; 
      background: #ffffff; 
      color: #0f172a;
      font-weight: bold;
    }
    
    select:focus, input:focus { 
      border-color: #2563eb; 
      outline: none; 
      background: #f8fafc; 
    }
    
    /* Botones de acción */
    .botones-accion {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn-salida { 
      background: #dc2626; 
      color: white; 
      border: none; 
      font-weight: bold; 
      font-size: 18px; 
      padding: 18px 10px; 
      flex: 1; 
      border-radius: 10px; 
      cursor: pointer; 
      text-align: center;
      box-shadow: 0 4px 6px rgba(220, 38, 38, 0.3);
    }
    .btn-salida:active { transform: scale(0.98); }

    .btn-entrada { 
      background: #16a34a; 
      color: white; 
      border: none; 
      font-weight: bold; 
      font-size: 18px; 
      padding: 18px 10px; 
      flex: 1; 
      border-radius: 10px; 
      cursor: pointer; 
      text-align: center;
      box-shadow: 0 4px 6px rgba(22, 163, 74, 0.3);
    }
    .btn-entrada:active { transform: scale(0.98); }

    .btn-nuevo {
      background: #2563eb;
      color: white;
      border: none;
      font-weight: bold;
      font-size: 18px;
      padding: 16px;
      width: 100%;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 15px;
      box-shadow: 0 4px 6px rgba(37, 99, 235, 0.3);
    }
    .btn-nuevo:hover { background: #1d4ed8; }
    
    .btn-init { 
      background: #475569; 
      font-size: 15px; 
      padding: 12px; 
      margin-top: 15px; 
      border-radius: 8px; 
      color: white; 
      border: none; 
      width: 100%; 
      cursor: pointer; 
      font-weight: bold; 
    }

    #mensajeAlerta { 
      display: none; 
      padding: 16px; 
      margin-top: 15px; 
      border-radius: 10px; 
      font-weight: bold; 
      text-align: center; 
      font-size: 18px; 
    }
    .alerta-exito { background: #dcfce7; color: #166534; border: 3px solid #86efac; }
    .alerta-error { background: #fee2e2; color: #991b1b; border: 3px solid #fca5a5; }

    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
    th, td { border: 2px solid #cbd5e1; padding: 14px; text-align: left; font-size: 17px; vertical-align: middle; }
    th { background: #0f172a; color: white; font-size: 18px; }
    
    .badge-ok { color: #16a34a; font-weight: bold; font-size: 17px; }
    .badge-no { color: #dc2626; font-weight: bold; font-size: 17px; }
    
    .total-box { 
      font-size: 20px; 
      font-weight: bold; 
      margin-top: 15px; 
      text-align: right; 
      color: #0f172a; 
      background: #e2e8f0; 
      padding: 14px; 
      border-radius: 8px; 
    }
    .loading { text-align: center; font-style: italic; color: #475569; padding: 20px; font-size: 18px; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="card">
    <h2>CONTROL DE BODEGA PVC</h2>
    
    <label for="codigoSelect">1. Elige la Lámina existente:</label>
    <select id="codigoSelect" onchange="completarSKU()">
      <option value="">-- Toca aquí para seleccionar --</option>
    </select>
    
    <input type="text" id="codigoManual" placeholder="O escribe el código aquí..." style="margin-top: 10px;">

    <label for="cantidad">2. Cantidad:</label>
    <input type="number" id="cantidad" placeholder="Ej. 5" style="font-size: 22px;">

    <label for="observacion">3. Nota / Factura (Opcional):</label>
    <input type="text" id="observacion" placeholder="Ej. Factura #123">

    <!-- Botón para añadir producto nuevo -->
    <button class="btn-nuevo" onclick="agregarNuevoProducto()">➕ AÑADIR NUEVO PRODUCTO</button>

    <!-- Botones de Venta y Compra -->
    <div class="botones-accion">
      <button class="btn-salida" onclick="registrarMovimiento('Salida')">🔴 VENTA / SALIDA</button>
      <button class="btn-entrada" onclick="registrarMovimiento('Entrada')">🟢 COMPRA / ENTRADA</button>
    </div>
    
    <div id="mensajeAlerta"></div>

    <button class="btn-init" onclick="cargarInventarioInicial()">⚙️ Cargar Stock Inicial (Solo primer día)</button>
  </div>

  <div class="card">
    <h2>Stock en Tiempo Real</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>SKU</th>
            <th>Stock</th>
            <th>Estado</th>
            <th>Nota</th>
          </tr>
        </thead>
        <tbody id="tablaInventario">
          <tr><td colspan="4" class="loading">Conectando...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="total-box" id="totalGeneral">Total en bodega: 0</div>
  </div>

</div>

<!-- Importar Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBZatVDM_4fZ-7V3ujpWMGu3FIM-XqkQL4",
    authDomain: "inventariopvc-9865e.firebaseapp.com",
    projectId: "inventariopvc-9865e",
    storageBucket: "inventariopvc-9865e.appspot.com",
    messagingSenderId: "418733149343",
    appId: "1:418733149343:web:7cc8630f6d3895cb28a6aa",
    measurementId: "G-HSXVQ2L7L"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const datosOriginales = [
    { codigo: "A: 251", cantidad: 122, observaciones: "" },
    { codigo: "EG: 304", cantidad: 54, observaciones: "" },
    { codigo: "302", cantidad: 6, observaciones: "" },
    { codigo: "054", cantidad: 54, observaciones: "" },
    { codigo: "D 0247", cantidad: 24, observaciones: "Revisado" },
    { codigo: "A2502", cantidad: 18, observaciones: "" },
    { codigo: "252", cantidad: 103, observaciones: "" },
    { codigo: "B 2524", cantidad: 87, observaciones: "" },
    { codigo: "D: 3057", cantidad: 81, observaciones: "Revisado" },
    { codigo: "A0018", cantidad: 94, observaciones: "Revisado" },
    { codigo: "A250", cantidad: 44, observaciones: "Revisado" },
    { codigo: "2531", cantidad: 103, observaciones: "" },
    { codigo: "2598", cantidad: 161, observaciones: "Revisado" },
    { codigo: "2522", cantidad: 0, observaciones: "NO HAY" },
    { codigo: "52", cantidad: 50, observaciones: "" },
    { codigo: "39", cantidad: 100, observaciones: "" }
  ];

  function mostrarAlerta(texto, esError = false) {
    const alerta = document.getElementById('mensajeAlerta');
    alerta.innerText = texto;
    alerta.className = esError ? 'alerta-error' : 'alerta-exito';
    alerta.style.display = 'block';
    setTimeout(() => { alerta.style.display = 'none'; }, 4000);
  }

  // Escuchar Stock en tiempo real
  const qInventario = collection(db, "laminas_pvc");
  onSnapshot(qInventario, (snapshot) => {
    const tabla = document.getElementById('tablaInventario');
    const select = document.getElementById('codigoSelect');
    
    tabla.innerHTML = '';
    select.innerHTML = '<option value="">-- Toca aquí para seleccionar --</option>';
    
    let totalAcumulado = 0;
    let items = [];

    snapshot.forEach((docSnap) => { items.push(docSnap.data()); });
    items.sort((a, b) => a.codigo.localeCompare(b.codigo));

    if (items.length === 0) {
      tabla.innerHTML = `<tr><td colspan="4" style="text-align:center;">No hay datos. Toca el botón gris de abajo.</td></tr>`;
      document.getElementById('totalGeneral').innerText = `Total en bodega: 0`;
      return;
    }

    items.forEach((item) => {
      let stockNum = Number(item.cantidad) || 0;
      totalAcumulado += stockNum;
      let estadoHTML = stockNum > 0 ? '<span class="badge-ok">Disponible</span>' : '<span class="badge-no">Agotado</span>';
      
      tabla.innerHTML += `
        <tr>
          <td><b>${item.codigo}</b></td>
          <td style="font-size: 20px; font-weight: bold;">${stockNum}</td>
          <td>${estadoHTML}</td>
          <td>${item.observaciones || '-'}</td>
        </tr>
      `;
      select.innerHTML += `<option value="${item.codigo}">${item.codigo} (Stock: ${stockNum})</option>`;
    });

    document.getElementById('totalGeneral').innerText = `Total en bodega: ${totalAcumulado} láminas`;
  });

  window.completarSKU = function() {
    let sel = document.getElementById('codigoSelect').value;
    if (sel) document.getElementById('codigoManual').value = sel;
  }

  window.cargarInventarioInicial = async function() {
    if(!confirm("¿Cargar stock inicial en la nube?")) return;
    try {
      for (let item of datosOriginales) {
        let docId = item.codigo.replace(/[^a-zA-Z0-9]/g, '_');
        await setDoc(doc(db, "laminas_pvc", docId), item);
      }
      mostrarAlerta("¡Stock inicial cargado con éxito!");
    } catch (e) {
      mostrarAlerta("Error: " + e.message, true);
    }
  }

  // Función para añadir un producto nuevo
  window.agregarNuevoProducto = async function() {
    let codigo = document.getElementById('codigoManual').value.trim();
    let cantidad = parseInt(document.getElementById('cantidad').value);
    let obs = document.getElementById('observacion').value.trim();

    if (!codigo) {
      mostrarAlerta('Escribe el código SKU del nuevo producto.', true);
      return;
    }
    if (isNaN(cantidad) || cantidad < 0) {
      mostrarAlerta('Ingresa una cantidad inicial válida.', true);
      return;
    }

    let docId = codigo.replace(/[^a-zA-Z0-9]/g, '_');
    let docRef = doc(db, "laminas_pvc", docId);
    let docSnap = await getDoc(docRef);

    if (docSnap.exists()) {
      mostrarAlerta(`El código "${codigo}" ya existe. Usa los botones de Venta o Compra.`, true);
      return;
    }

    await setDoc(docRef, { 
      codigo: codigo, 
      cantidad: cantidad, 
      observaciones: obs || 'Nuevo producto' 
    });

    mostrarAlerta(`¡Nuevo producto "${codigo}" añadido con éxito!`);
    document.getElementById('codigoManual').value = '';
    document.getElementById('codigoSelect').value = '';
    document.getElementById('cantidad').value = '';
    document.getElementById('observacion').value = '';
  }

  window.registrarMovimiento = async function(tipo) {
    let codigo = document.getElementById('codigoManual').value.trim();
    let cantidad = parseInt(document.getElementById('cantidad').value);
    let obs = document.getElementById('observacion').value.trim();

    if (!codigo) {
      mostrarAlerta('Selecciona o escribe un código SKU.', true);
      return;
    }
    if (isNaN(cantidad) || cantidad <= 0) {
      mostrarAlerta('Ingresa una cantidad válida.', true);
      return;
    }

    let docId = codigo.replace(/[^a-zA-Z0-9]/g, '_');
    let docRef = doc(db, "laminas_pvc", docId);
    let docSnap = await getDoc(docRef);

    let stockActual = docSnap.exists() ? Number(docSnap.data().cantidad) || 0 : 0;
    let nuevoStock = stockActual;

    if (tipo === 'Entrada') {
      nuevoStock += cantidad;
    } else {
      if (stockActual < cantidad) {
        mostrarAlerta(`Stock insuficiente. Solo quedan ${stockActual} unidades.`, true);
        return;
      }
      nuevoStock -= cantidad;
    }

    let obsFinal = obs || (tipo === 'Entrada' ? 'Compra' : 'Venta');

    await setDoc(docRef, { 
      codigo: codigo, 
      cantidad: nuevoStock, 
      observaciones: obsFinal 
    }, { merge: true });

    mostrarAlerta(`¡Registrado con éxito!`);
    document.getElementById('codigoManual').value = '';
    document.getElementById('codigoSelect').value = '';
    document.getElementById('cantidad').value = '';
    document.getElementById('observacion').value = '';
  }
</script>

</body>
</html>
