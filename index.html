<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventario en Tiempo Real - Láminas PVC</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 15px; background: #f4f6f8; color: #333; }
    .container { max-width: 700px; margin: auto; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
    h2 { margin-top: 0; color: #1e293b; font-size: 22px; }
    label { display: block; margin-top: 10px; font-weight: bold; font-size: 14px; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; }
    button { background: #0f172a; color: white; border: none; font-weight: bold; cursor: pointer; margin-top: 15px; }
    button:hover { background: #334155; }
    .btn-init { background: #16a34a; margin-top: 5px; font-size: 13px; padding: 6px; }
    .btn-init:hover { background: #15803d; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; background: white; }
    th, td { border: 1px solid #e2e8f0; padding: 10px; text-align: left; font-size: 14px; }
    th { background: #1e293b; color: white; }
    .badge-ok { color: #16a34a; font-weight: bold; }
    .badge-no { color: #dc2626; font-weight: bold; }
    .total-box { font-size: 16px; font-weight: bold; margin-top: 10px; text-align: right; }
    .loading { text-align: center; font-style: italic; color: #666; }
  </style>
</head>
<body>

<div class="container">
  
  <div class="card">
    <h2>Control de Inventario - PVC (En Vivo)</h2>
    
    <label for="codigoSelect">Seleccionar o Escribir SKU:</label>
    <select id="codigoSelect" onchange="completarSKU()">
      <option value="">-- Elige una lámina del inventario --</option>
    </select>
    <input type="text" id="codigoManual" placeholder="O escribe un código nuevo..." style="margin-top: 8px;">

    <label for="tipoMovimiento">Tipo de Movimiento:</label>
    <select id="tipoMovimiento">
      <option value="Entrada">Entrada (Nueva Compra / Stock)</option>
      <option value="Salida">Salida (Venta / Despacho)</option>
    </select>
    
    <label for="cantidad">Cantidad:</label>
    <input type="number" id="cantidad" placeholder="Ej. 10">

    <label for="observacion">Observaciones / Notas:</label>
    <input type="text" id="observacion" placeholder="Ej. Venta factura #123">

    <button onclick="registrarMovimiento()">Registrar Movimiento</button>
    <button class="btn-init" onclick="cargarInventarioInicial()">Subir Inventario Inicial (Solo 1 vez)</button>
  </div>

  <div class="card">
    <h2>Stock Actual Sincronizado</h2>
    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>Código SKU</th>
            <th>Stock Actual</th>
            <th>Estado</th>
            <th>Observación</th>
          </tr>
        </thead>
        <tbody id="tablaInventario">
          <tr><td colspan="4" class="loading">Conectando con la base de datos en tiempo real...</td></tr>
        </tbody>
      </table>
    </div>
    <div class="total-box" id="totalGeneral">Total de láminas: 0</div>
  </div>

</div>

<!-- Importar Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getFirestore, collection, onSnapshot, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // Credenciales de tu proyecto de Firebase
  const firebaseConfig = {
    apiKey: "AIzaSyBZatVDM_4fZ-7V3ujpWMGu3FIM-XqkQL4",
    authDomain: "inventariopvc-9865e.firebaseapp.com",
    projectId: "inventariopvc-9865e",
    storageBucket: "inventariopvc-9865e.appspot.com",
    messagingSenderId: "418733149343",
    appId: "1:418733149343:web:7cc8630f6d3895cb28a6aa",
    measurementId: "G-HSXVQ2L7L"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // Datos originales extraídos de tu registro físico
  const datosOriginales = [
    { codigo: "A: 251", cantidad: 122, observaciones: "" },
    { codigo: "EG: 304", cantidad: 54, observaciones: "" },
    { codigo: "302", cantidad: 6, observaciones: "" },
    { codigo: "054", cantidad: 54, observaciones: "" },
    { codigo: "D 0247", cantidad: 24, observaciones: "Revisado / Visto bueno" },
    { codigo: "A2502", cantidad: 18, observaciones: "" },
    { codigo: "252", cantidad: 103, observaciones: "" },
    { codigo: "B 2524", cantidad: 87, observaciones: "" },
    { codigo: "D: 3057", cantidad: 81, observaciones: "Revisado / Visto bueno" },
    { codigo: "A0018", cantidad: 94, observaciones: "Revisado / Visto bueno" },
    { codigo: "A250", cantidad: 44, observaciones: "Revisado / Visto bueno" },
    { codigo: "2531", cantidad: 103, observaciones: "" },
    { codigo: "2598", cantidad: 161, observaciones: "Revisado / Visto bueno" },
    { codigo: "2522", cantidad: 0, observaciones: "NO HAY" },
    { codigo: "52", cantidad: 50, observaciones: "" },
    { codigo: "39", cantidad: 100, observaciones: "" }
  ];

  // Escuchar cambios en tiempo real en Firestore
  const q = collection(db, "laminas_pvc");
  onSnapshot(q, (snapshot) => {
    const tabla = document.getElementById('tablaInventario');
    const select = document.getElementById('codigoSelect');
    
    tabla.innerHTML = '';
    select.innerHTML = '<option value="">-- Elige una lámina del inventario --</option>';
    
    let totalAcumulado = 0;
    let items = [];

    snapshot.forEach((docSnap) => {
      items.push(docSnap.data());
    });

    items.sort((a, b) => a.codigo.localeCompare(b.codigo));

    if (items.length === 0) {
      tabla.innerHTML = `<tr><td colspan="4" style="text-align:center;">No hay datos en la nube. Haz clic en "Subir Inventario Inicial" abajo.</td></tr>`;
      document.getElementById('totalGeneral').innerText = `Total general en bodega: 0 láminas`;
      return;
    }

    items.forEach((item) => {
      let stockNum = Number(item.cantidad) || 0;
      totalAcumulado += stockNum;
      
      let estadoHTML = stockNum > 0 ? '<span class="badge-ok">Disponible</span>' : '<span class="badge-no">Agotado</span>';
      
      tabla.innerHTML += `
        <tr>
          <td><b>${item.codigo}</b></td>
          <td>${stockNum}</td>
          <td>${estadoHTML}</td>
          <td>${item.observaciones || '-'}</td>
        </tr>
      `;

      select.innerHTML += `<option value="${item.codigo}">${item.codigo} (Stock: ${stockNum})</option>`;
    });

    document.getElementById('totalGeneral').innerText = `Total general en bodega: ${totalAcumulado} láminas`;
  });

  window.completarSKU = function() {
    const seleccionado = document.getElementById('codigoSelect').value;
    if (seleccionado) {
      document.getElementById('codigoManual').value = seleccionado;
    }
  }

  window.cargarInventarioInicial = async function() {
    if(!confirm("¿Deseas subir los datos iniciales de las láminas a Firebase?")) return;
    try {
      for (let item of datosOriginales) {
        let docId = item.codigo.replace(/[^a-zA-Z0-9]/g, '_');
        let docRef = doc(db, "laminas_pvc", docId);
        await setDoc(docRef, item);
      }
      alert("¡Inventario inicial subido con éxito a la nube!");
    } catch (e) {
      alert("Error al subir datos: " + e.message);
    }
  }

  window.registrarMovimiento = async function() {
    let codigo = document.getElementById('codigoManual').value.trim();
    let tipo = document.getElementById('tipoMovimiento').value;
    let cantidad = parseInt(document.getElementById('cantidad').value);
    let obs = document.getElementById('observacion').value.trim();

    if (!codigo) {
      alert('Por favor selecciona o escribe un código SKU.');
      return;
    }
    if (isNaN(cantidad) || cantidad <= 0) {
      alert('Ingresa una cantidad válida mayor a 0.');
      return;
    }

    let docId = codigo.replace(/[^a-zA-Z0-9]/g, '_');
    let docRef = doc(db, "laminas_pvc", docId);
    let docSnap = await getDoc(docRef);

    let stockActual = 0;
    if (docSnap.exists()) {
      stockActual = Number(docSnap.data().cantidad) || 0;
    }

    let nuevoStock = stockActual;
    if (tipo === 'Entrada') {
      nuevoStock += cantidad;
    } else if (tipo === 'Salida') {
      if (stockActual < cantidad) {
        alert(`Stock insuficiente. Solo quedan ${stockActual} unidades.`);
        return;
      }
      nuevoStock -= cantidad;
    }

    let observacionFinal = obs || (tipo === 'Entrada' ? 'Nueva entrada' : 'Salida de bodega');

    await setDoc(docRef, {
      codigo: codigo,
      cantidad: nuevoStock,
      observaciones: observacionFinal
    }, { merge: true });

    alert('¡Movimiento registrado y sincronizado en tiempo real!');
    
    document.getElementById('codigoManual').value = '';
    document.getElementById('codigoSelect').value = '';
    document.getElementById('cantidad').value = '';
    document.getElementById('observacion').value = '';
  }
</script>

</body>
</html>
